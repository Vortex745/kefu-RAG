<button class="group/send relative grid size-7 flex-none cursor-pointer place-items-center rounded-full bg-neutral-900 text-white transition-[opacity,transform] duration-[120ms] hover:not-disabled:scale-[1.04] active:not-disabled:scale-[0.94] disabled:cursor-default disabled:opacity-40 [&_svg]:size-[17px]" id="send-btn" data-running="false" type="submit" aria-label="发送消息" title="发送消息" disabled>
  <svg class="send-icon col-start-1 row-start-1 transition-[opacity,transform] duration-[140ms] ease-out group-data-[running=true]/send:pointer-events-none group-data-[running=true]/send:scale-75 group-data-[running=true]/send:opacity-0" aria-hidden="true"><use href="#icon-arrow-up"/></svg>
  <svg class="send-icon col-start-1 row-start-1 scale-75 opacity-0 transition-[opacity,transform] duration-[140ms] ease-out group-data-[running=true]/send:scale-100 group-data-[running=true]/send:opacity-100" aria-hidden="true"><use href="#icon-stop"/></svg>
</button>
              </div>

        </div>
      </section>

    </div>
    <section class="min-h-0 overflow-y-auto px-6 py-7 max-md:px-[18px] max-md:py-6" id="insight-path-panel" role="tabpanel" aria-labelledby="insight-path-tab">
      <ol class="mx-auto w-[min(100%,420px)] list-none py-1" id="insight-path-chain"></ol>
    </section>
    <section class="min-h-0 overflow-y-auto px-6 py-7 max-md:px-[18px] max-md:py-6" id="insight-evaluation-panel" role="tabpanel" aria-labelledby="insight-evaluation-tab" hidden>
      <div class="mb-7 flex items-center justify-between">
        <div>
          <h3 class="text-sm font-semibold">RAGAS 质量评估</h3>
          <p class="mt-[3px] text-xs text-neutral-500">基于最近一次评估结果</p>
        </div>
        <button class="grid size-8 flex-none cursor-pointer place-items-center rounded-md bg-transparent text-neutral-500 transition-colors duration-[120ms] hover:bg-surface-muted hover:text-neutral-900 disabled:cursor-default disabled:opacity-40 [&_svg]:size-[17px]" id="ragas-refresh" type="button" aria-label="刷新质量评估" title="刷新">
          <svg aria-hidden="true"><use href="#icon-refresh"/></svg>
        </button>
      </div>
      <div class="grid gap-6" id="ragas-content" aria-live="polite"></div>
    </section>
  </dialog>

  <dialog class="m-auto h-[min(640px,calc(100dvh_-_48px))] w-[min(540px,calc(100vw_-_32px))] max-w-none overflow-hidden rounded-[16px] border border-neutral-200/60 bg-white text-neutral-900 shadow-[0_24px_48px_-12px_rgba(0,0,0,0.18)] outline-none backdrop:bg-black/20 backdrop:backdrop-blur-sm transition-all open:animate-[dialog-enter_240ms_cubic-bezier(0.23,1,0.32,1)] open:flex open:flex-col max-md:m-0 max-md:h-dvh max-md:w-screen max-md:rounded-none max-md:border-0" id="import-dialog" aria-labelledby="import-title">
    <div class="flex h-14 flex-none items-center justify-between border-b border-neutral-100 px-5 max-md:px-4">
      <h2 class="text-[15px] font-semibold text-neutral-900" id="import-title">导入文档</h2>
      <button class="grid size-8 flex-none cursor-pointer place-items-center rounded-md bg-transparent text-neutral-500 transition-all duration-[160ms] hover:bg-neutral-100 hover:text-neutral-900 active:scale-95 [&_svg]:size-[18px]" id="import-close" type="button" aria-label="关闭" title="关闭">
        <svg aria-hidden="true"><use href="#icon-x"/></svg>
      </button>
    </div>
    <div class="flex-none border-b border-neutral-100 px-5 pb-0 pt-3 max-md:px-4" id="import-tabs" role="tablist" aria-label="导入方式">
      <div class="flex items-center gap-6">
        <button class="relative h-9 cursor-pointer bg-transparent px-1 text-[14px] font-medium text-neutral-500 transition-colors duration-200 hover:text-neutral-800 data-[active=true]:font-semibold data-[active=true]:text-neutral-900 data-[active=true]:after:absolute data-[active=true]:after:inset-x-0 data-[active=true]:after:-bottom-[1px] data-[active=true]:after:h-0.5 data-[active=true]:after:rounded-t-full data-[active=true]:after:bg-neutral-900 data-[active=true]:after:content-['']" id="import-folder-tab" type="button" role="tab" aria-selected="true" aria-controls="import-folder-panel" data-import-tab="folder" data-active="true">文件夹</button>
        <button class="relative h-9 cursor-pointer bg-transparent px-1 text-[14px] font-medium text-neutral-500 transition-colors duration-200 hover:text-neutral-800 data-[active=true]:font-semibold data-[active=true]:text-neutral-900 data-[active=true]:after:absolute data-[active=true]:after:inset-x-0 data-[active=true]:after:-bottom-[1px] data-[active=true]:after:h-0.5 data-[active=true]:after:rounded-t-full data-[active=true]:after:bg-neutral-900 data-[active=true]:after:content-['']" id="import-url-tab" type="button" role="tab" aria-selected="false" aria-controls="import-url-panel" data-import-tab="url" data-active="false">链接 (URL)</button>
      </div>
    </div>
    <section class="flex min-h-0 flex-1 flex-col overflow-y-auto bg-neutral-50/50 px-5 py-6 max-md:px-4" id="import-folder-panel" role="tabpanel" aria-labelledby="import-folder-tab">
      <div class="flex flex-col items-center justify-center rounded-[12px] border-2 border-dashed border-neutral-200 bg-white px-6 py-10 text-center transition-colors hover:border-neutral-300">
        <div class="mb-4 grid size-12 place-items-center rounded-full bg-neutral-100 text-neutral-600">
          <svg class="size-6" aria-hidden="true"><use href="#icon-database"/></svg>
        </div>
        <h3 class="mb-1 text-[14px] font-medium text-neutral-900">选择包含文档的文件夹</h3>
        <p class="mb-6 text-[13px] text-neutral-500">支持 PDF, Word, Markdown, HTML, Excel, PPT</p>
        <label class="inline-flex h-10 cursor-pointer items-center justify-center gap-2 rounded-[8px] bg-neutral-900 px-5 text-[14px] font-medium text-white shadow-sm transition-all duration-[160ms] ease-[cubic-bezier(0.23,1,0.32,1)] hover:bg-neutral-800 hover:shadow-md active:scale-[0.97]">
          <span>选择本地文件夹</span>
          <input type="file" id="import-folder-input" webkitdirectory multiple class="hidden" accept=".pdf,.doc,.docx,.md,.txt,.html,.htm,.xls,.xlsx,.ppt,.pptx">
        </label>
      </div>
    </section>
    <section class="flex min-h-0 flex-1 flex-col overflow-y-auto bg-neutral-50/50 px-5 py-6 max-md:px-4" id="import-url-panel" role="tabpanel" aria-labelledby="import-url-tab" hidden>
      <div class="w-full" id="import-url-content"></div>
    </section>
    <div class="hidden border-t border-neutral-200 px-6 py-4 max-md:px-[18px]" id="import-progress-section">
      <div class="hidden max-h-[200px] grid-cols-1 gap-1.5 overflow-y-auto" id="import-items-list"></div>
    </div>
  </dialog>

  <div class="pointer-events-none fixed bottom-6 left-1/2 z-[100] max-w-[min(360px,calc(100vw_-_32px))] -translate-x-1/2 translate-y-3 rounded-[7px] border border-[#303030] bg-neutral-900 px-3 py-2 text-xs text-white opacity-0 transition-[opacity,transform] duration-150 data-[visible=true]:translate-y-0 data-[visible=true]:opacity-100" id="toast" data-visible="false" role="status" aria-live="polite"></div>

  <script type="module" src="js/conversation.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
