# Operator-provisioned local stack for retrieval and Langfuse.
# Usage:
#   docker compose -f docker-compose.op-stack.yml up -d elasticsearch neo4j
#   docker compose -f docker-compose.op-stack.yml up -d langfuse
#   docker compose -f docker-compose.op-stack.yml down
#
# Service mapping to OP blockers:
#   - elasticsearch: OP-03 (retrieval stack) — port 9200
#   - neo4j:         OP-03 (retrieval stack) — port 7687
#   - langfuse:      OP-05 (observability) — port 3000
#   - langfuse-pg:   OP-05 (Langfuse persistence) — port 5432
#
# After starting:
#   - ES:      curl http://localhost:9200/_cluster/health
#   - Neo4j:   cypher -u neo4j -p localpassword bolt://localhost:7687 "RETURN 1"
#   - Langfuse: open http://localhost:3000 (initial setup creates admin + project keys)
#
# Env wiring (set in shell before running release probes):
#   - NEO4J_URI=bolt://localhost:7687
#   - NEO4J_USER=neo4j
#   - NEO4J_PASSWORD=localpassword
#   - LANGFUSE_BASE_URL=http://localhost:3000
#   - LANGFUSE_PUBLIC_KEY=pk-lf-...  (from Langfuse UI after project creation)
#   - LANGFUSE_SECRET_KEY=sk-lf-...  (from Langfuse UI after project creation)

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.2
    container_name: op-local-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -E '\"status\":\"(green|yellow)\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  neo4j:
    image: neo4j:5.26
    container_name: op-local-neo4j
    environment:
      - NEO4J_AUTH=neo4j/localpassword
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=512m
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7474/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  langfuse-pg:
    image: postgres:16-alpine
    container_name: op-local-langfuse-pg
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    ports:
      - "5432:5432"
    volumes:
      - op-langfuse-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:latest
    container_name: op-local-langfuse
    depends_on:
      langfuse-pg:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-pg:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: op-local-secret-change-me
      SALT: op-local-salt-change-me
      CLICKHOUSE_URL: ""
      TELEMETRY_ENABLED: "false"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/public/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  op-langfuse-pg-data:
